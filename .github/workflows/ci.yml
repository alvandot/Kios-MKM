name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      # Regresi nyata dua kali di repo ini: atribut android:permission pada
      # ProvisioningReceiver hilang saat refactor, sehingga aplikasi pihak
      # ketiga bisa mengganti PIN admin lewat broadcast. KDoc tetap mengklaim
      # proteksi, jadi hanya manifest yang bisa dipercaya.
      - name: Admin PIN receiver must stay DUMP-protected
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          receiver = re.search(
              r'<receiver[^>]*android:name="\.kiosk\.ProvisioningReceiver"[^>]*>', manifest
          )
          if receiver is None:
              sys.exit('FAIL: ProvisioningReceiver tidak ditemukan di AndroidManifest.xml')
          if 'android:permission="android.permission.DUMP"' not in receiver.group(0):
              sys.exit('FAIL: ProvisioningReceiver kehilangan android:permission="android.permission.DUMP"')
          print('OK: ProvisioningReceiver dilindungi android.permission.DUMP')
          PY

  build:
    name: Gradle assembleDebug
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # assembleDebug meng-bundle JS, jadi node_modules wajib ada sebelum Gradle jalan.
      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
